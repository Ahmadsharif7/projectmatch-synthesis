<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectMatch Synthesis - Capability-Driven Team Architecture</title>
  <meta name="description" content="AI-driven capability mapping and team synthesis platform. Discover the people and projects that complete your team topology." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Theme Styles -->
  <link rel="stylesheet" href="./src/styles/theme.css" />
</head>
<body>
  <!-- Ambient WebGL Shader Background -->
  <div class="shader-background-container" id="shader-bg">
    <canvas id="shader-canvas"></canvas>
  </div>

  <!-- App Layout Root -->
  <div id="app" class="app-layout">
    <!-- Desktop Side Navigation -->
    <aside id="side-nav" class="side-nav"></aside>

    <!-- Desktop Top Header Bar -->
    <header id="top-header" class="top-header"></header>

    <!-- Main Content Stage -->
    <main id="main-content" class="main-content" tabindex="-1">
      <div id="view-container" class="view-container"></div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-nav" class="mobile-nav"></nav>
  </div>

  <!-- Global Modals & Overlays Container -->
  <div id="modal-container" class="modal-container hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main JavaScript Entrypoint -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
